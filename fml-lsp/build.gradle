dependencies {
  // openflexo dep
  implementation project(':flexo-foundation')
  api project(':fml-parser')

  //LSP support
  implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.9.0'

  //WebSocketServer dependencies
  implementation 'org.springframework.boot:spring-boot-starter:2.7.18'
  implementation 'org.springframework.boot:spring-boot-starter-web:2.7.18'
  implementation 'org.springframework.boot:spring-boot-starter-websocket:2.7.18'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.4'
    

  
  // testing dep
  testImplementation flexoFoundationTest()
  testImplementation project(':flexo-test-resources')
  
  
}
