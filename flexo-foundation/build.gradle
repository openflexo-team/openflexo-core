dependencies {
  // openflexo dep
  api flexoP2PP()
  api flexoLocalization()
  api pamela()
  // Still to be removed
  implementation flexoGraphicUtils() // used for icon mgt in FlexoConcept
  // gina sits BELOW openflexo-core in the layering (connie -> pamela -> gina/diana -> openflexo-core),
  // and gina-api depends on nothing above connie/pamela. FIBComponentResource makes a .fib / .inspector
  // stored in a Xxx.fml/ container a first-class platform resource, the way a .fml.rt already is.
  // 'api' rather than 'implementation': FIBComponent leaks into the signature of FIBComponentResource.
  api ginaApi()

  // Replacement for java.xml.bind
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api:2.3.3'
  implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.3'

  // external dep
  api group: 'org.eclipse.jgit', name: 'org.eclipse.jgit', version: '5.8.0.202006091008-r'
  api group: 'com.google.inject', name: 'guice', version: '4.2.3'
 // api group: 'findbugs', name: 'annotations', version: '1.0.0'
  implementation group: 'xerces', name: 'xercesImpl', version: '2.12.2',  {
       exclude group: "xml-apis", module: "xml-apis"
  }

}

