dependencies {
  // openflexo dep
  implementation group: 'junit', name: 'junit', version: '4.13.2'
  implementation project(':flexo-foundation')
  api project(':flexo-foundation-rm')
  // external dep

  // testing dep
//  testCompile testUtils()
  testImplementation project(':flexo-test-resources')
}

// TEMPORARY diagnostics (ResourceDiagnostics): one file per test JVM in build/diag, emptied before each run
def resourceDiagnosticsDir = file("${buildDir}/diag")
// Only the test task: testAll runs uiTest after it, which would empty the directory again
tasks.named('test') {
  systemProperty 'openflexo.resourceDiagnostics', resourceDiagnosticsDir.absolutePath
  doFirst { delete resourceDiagnosticsDir }
}
